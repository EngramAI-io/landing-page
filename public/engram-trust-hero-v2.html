<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lineage — AI Agent Attribution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #4fd1c5;
      --amber: #d8a24b;
      --red: #e36b6b;
      --text: #f2f5fb;
      --muted: #9eabba;
      --muted2: #6b7f94;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 18% 12%, rgba(79,209,197,0.07), transparent 30%),
                  radial-gradient(circle at 82% 78%, rgba(216,162,75,0.06), transparent 28%),
                  linear-gradient(180deg, #05070b 0%, #070b11 100%);
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .frame {
      width: 100%;
      max-width: 1440px;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.01);
      box-shadow: 0 20px 80px rgba(0,0,0,0.5);
    }
    svg { display: block; width: 100%; height: 100%; }

    /* Text styles */
    .lbl    { fill: var(--text);  font-size: 15px; font-weight: 600; }
    .sub    { fill: var(--muted); font-size: 11.5px; }
    .mini   { fill: var(--muted2); font-size: 10.5px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }
    .tag    { fill: var(--teal);  font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .verdict-text { fill: var(--red); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; font-family: 'JetBrains Mono', monospace; }
    .allow-text   { fill: var(--teal); font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .center { text-anchor: middle; }
    .right  { text-anchor: end; }
    .grid { stroke: rgba(255,255,255,0.04); stroke-width: 1; fill: none; }
    .divider { stroke: rgba(255,255,255,0.08); stroke-width: 1; }

    /* Nodes */
    .node        { fill: rgba(8,12,18,0.92); stroke: rgba(255,255,255,0.10); stroke-width: 1.2; }
    .node-teal   { fill: rgba(8,12,18,0.92); stroke: rgba(79,209,197,0.30); stroke-width: 1.4; }
    .node-amber  { fill: rgba(8,12,18,0.92); stroke: rgba(216,162,75,0.28); stroke-width: 1.4; }
    .node-red    { fill: rgba(227,107,107,0.08); stroke: rgba(227,107,107,0.36); stroke-width: 1.4; }
    .node-accent { fill: rgba(79,209,197,0.06); stroke: rgba(79,209,197,0.45); stroke-width: 1.6; }

    /* Flow lines */
    .flow      { fill: none; stroke-width: 1.8; stroke-linecap: round; }
    .flow-dash { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 5 8; }

    /* Pill tags */
    .pill-teal  { fill: rgba(79,209,197,0.10); stroke: rgba(79,209,197,0.28); stroke-width: 1; }
    .pill-amber { fill: rgba(216,162,75,0.10); stroke: rgba(216,162,75,0.28); stroke-width: 1; }
    .pill-red   { fill: rgba(227,107,107,0.12); stroke: rgba(227,107,107,0.32); stroke-width: 1; }
    .pill-dark  { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.10); stroke-width: 1; }

    @keyframes dash-anim {
      to { stroke-dashoffset: -26; }
    }
    .flow-anim {
      stroke-dasharray: 6 10;
      stroke-dashoffset: 0;
      animation: dash-anim 1.4s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }
    .pulse { animation: pulse 2s ease-in-out infinite; }

    @media (max-width: 900px) {
      body { padding: 0; }
      .frame { border-radius: 0; }
      .lbl  { font-size: 12px; }
      .sub  { font-size: 9.5px; }
      .mini { font-size: 8.5px; }
    }
    @media (max-width: 600px) {
      .lbl  { font-size: 10px; }
      .sub  { font-size: 8px; }
      .mini { font-size: 7.5px; }
      .verdict-text { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1440 820" role="img"
         aria-label="Lineage attribution flow: Langfuse intent traces join with EDR kernel events through the Lineage attribution engine and deterministic policy + LLM judge, outputting verdicts back to CrowdStrike Falcon, SentinelOne, Cortex XDR, and Microsoft Defender consoles.">

      <defs>
        <!-- Gradients for flow lines -->
        <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="rgba(79,209,197,0.0)"/>
          <stop offset="40%"  stop-color="rgba(79,209,197,0.9)"/>
          <stop offset="100%" stop-color="rgba(79,209,197,0.3)"/>
        </linearGradient>
        <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="rgba(216,162,75,0.0)"/>
          <stop offset="40%"  stop-color="rgba(216,162,75,0.9)"/>
          <stop offset="100%" stop-color="rgba(216,162,75,0.3)"/>
        </linearGradient>
        <linearGradient id="gTealR" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%"   stop-color="rgba(79,209,197,0.0)"/>
          <stop offset="40%"  stop-color="rgba(79,209,197,0.7)"/>
          <stop offset="100%" stop-color="rgba(79,209,197,0.2)"/>
        </linearGradient>
        <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="rgba(227,107,107,0.1)"/>
          <stop offset="50%"  stop-color="rgba(227,107,107,0.9)"/>
          <stop offset="100%" stop-color="rgba(227,107,107,0.2)"/>
        </linearGradient>
        <!-- Soft glow filter -->
        <filter id="glow">
          <feGaussianBlur stdDeviation="8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-sm">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- ── Background grid ───────────────────────────────────────────── -->

        <line class="grid" x1="100" y1="430" x2="1340" y2="430"/>
        <line class="grid" x1="100" y1="580" x2="1340" y2="580"/>
        <line class="grid" x1="100" y1="720" x2="1340" y2="720"/>

        <line class="grid" x1="490" y1="80"  x2="490" y2="760"/>
        <line class="grid" x1="740" y1="80"  x2="740" y2="760"/>
        <line class="grid" x1="990" y1="80"  x2="990" y2="760"/>

      <!-- ── Column headers ────────────────────────────────────────────── -->

      <!-- ═══════════════════════════════════════════════════════════════ -->
      <!-- FLOW LINES                                                       -->
      <!-- ═══════════════════════════════════════════════════════════════ -->

      <!-- Langfuse → engine (intent) -->

      <!-- ═══════════════════════════════════════════════════════════════ -->
      <!-- BOTTOM LEGEND                                                    -->
      <!-- ═══════════════════════════════════════════════════════════════ -->
      <line x1="105" y1="660" x2="1322" y2="660" class="divider"/>

      <circle cx="120" cy="680" r="5" fill="rgba(79,209,197,0.9)" class="pulse"/>
      <text x="132" y="684" class="sub">Intent flow (Langfuse → engine)</text>

      <circle cx="380" cy="680" r="5" fill="rgba(216,162,75,0.9)" class="pulse" style="animation-delay:0.5s"/>
