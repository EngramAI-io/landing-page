<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EngramAI Trust Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f2f5fb;
      --muted: #9eabba;
      --muted-2: #8f9daf;
      --teal: #4fd1c5;
      --amber: #d8a24b;
      --red: #e36b6b;
    }
    * { box-sizing: border-box; overflow: hidden; }
    html, body { 
      margin: 0; 
      padding: 0;
      overflow: hidden !important;
      height: 100%;
    }
    body {
      background: radial-gradient(circle at 20% 15%, rgba(79,209,197,0.08), transparent 26%),
                  radial-gradient(circle at 84% 80%, rgba(216,162,75,0.07), transparent 24%),
                  linear-gradient(180deg, #05070b 0%, #070b11 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
    }
    .frame {
      width: min(1440px, 100%);
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      box-shadow: 0 20px 80px rgba(0,0,0,0.45);
    }
    .eyebrow { fill: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: 0.08em; }
    .headline { fill: var(--text); font-family: 'Libre Baskerville', serif; font-size: 44px; font-weight: 700; letter-spacing: -0.03em; }
    .subcopy { fill: #bcc7d4; font-size: 18px; }
    .label { fill: var(--text); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .small { fill: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; . }
    .micro { fill: var(--muted-2); font-size: 12px; }
    .caption { fill: #ccd6e3; font-size: 13px; font-weight: 500; }
    .mono { fill: #8fa3b8; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; . }
    .center { text-anchor: middle; }
    .node { fill: rgba(11,16,23,0.96); stroke: rgba(255,255,255,0.12); stroke-width: 1.2; }
    .node-glow { fill: rgba(79,209,197,0.06); stroke: rgba(79,209,197,0.28); }
    .blocked { fill: rgba(227,107,107,0.10); stroke: rgba(227,107,107,0.38); }
    .trusted { fill: rgba(79,209,197,0.10); stroke: rgba(79,209,197,0.36); }
    .terminal { fill: rgba(255,255,255,0.02); stroke: rgba(255,255,255,0.16); }
    .flow { fill: none; stroke-width: 2; stroke-linecap: round; }
    .flow.dashed { stroke-dasharray: 6 8; }
    .gridline { stroke: rgba(255,255,255,0.06); stroke-width: 1; }
    .divider { stroke: rgba(255,255,255,0.10); stroke-width: 1; }
    .pill { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.10); }
    .trace-dot { fill: #d9e4f0; }
    .amber-dot { fill: var(--amber); }
    .footer-copy { fill: #8f9caf; font-size: 12px; }
    @media (max-width: 900px) {
      body { padding: 0; overflow: hidden !important; }
      .frame { border-radius: 0; }
    }
    @media (max-width: 600px) {
      .frame { min-height: 100vh; }
      .eyebrow { font-size: 11px; }
      .headline { font-size: 24px; }
      .subcopy { font-size: 12px; }
      .small { font-size: 10px; }
      .micro { font-size: 10px; }
      .label { font-size: 12px; }
      .mono { font-size: 9px; }
      .caption { font-size: 10px; }
    }
    @media (max-width: 400px) {
      .headline { font-size: 20px; }
      .subcopy { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1440 900" width="100%" role="img" aria-label="Homepage landing graphic for EngramAI showing AI agents passing through agent identity, ephemeral access, intent firewall, and policy audit controls before reaching enterprise systems.">
      <defs>
        <linearGradient id="tealFlow" x1="0" x2="1">
          <stop offset="0%" stop-color="rgba(79,209,197,0.15)" />
          <stop offset="45%" stop-color="rgba(79,209,197,0.85)" />
          <stop offset="100%" stop-color="rgba(79,209,197,0.15)" />
        </linearGradient>
        <linearGradient id="amberFlow" x1="0" x2="1">
          <stop offset="0%" stop-color="rgba(216,162,75,0.16)" />
          <stop offset="50%" stop-color="rgba(216,162,75,0.84)" />
          <stop offset="100%" stop-color="rgba(216,162,75,0.16)" />
        </linearGradient>
        <linearGradient id="redFlow" x1="0" x2="1">
          <stop offset="0%" stop-color="rgba(227,107,107,0.12)" />
          <stop offset="50%" stop-color="rgba(227,107,107,0.88)" />
          <stop offset="100%" stop-color="rgba(227,107,107,0.12)" />
        </linearGradient>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g opacity="0.72">
        <line class="gridline" x1="90" y1="150" x2="1350" y2="150"/>
        <line class="gridline" x1="90" y1="330" x2="1350" y2="330"/>
        <line class="gridline" x1="90" y1="510" x2="1350" y2="510"/>
        <line class="gridline" x1="90" y1="690" x2="1350" y2="690"/>
        <line class="gridline" x1="250" y1="90" x2="250" y2="800"/>
        <line class="gridline" x1="520" y1="90" x2="520" y2="800"/>
        <line class="gridline" x1="780" y1="90" x2="780" y2="800"/>
        <line class="gridline" x1="1035" y1="90" x2="1035" y2="800"/>
      </g>

      <text x="90" y="78" class="eyebrow">EngramAI</text>
      <text x="90" y="132" class="headline">The Trust Layer for Agentic AI</text>
      <text x="90" y="170" class="subcopy">Every action is signed, scoped, verified, and enforced before execution.</text>

      <g>
        <text x="90" y="250" class="small">Origin</text>
        <rect x="90" y="285" width="170" height="250" rx="18" class="terminal"/>
        <text x="175" y="335" class="label center">AI Agents</text>
        <text x="175" y="362" class="micro center">Autonomous workers</text>
        <text x="175" y="381" class="micro center">Tool-using planners</text>
        <text x="175" y="400" class="micro center">Multi-step execution</text>
        <circle cx="136" cy="447" r="7" class="trace-dot"/>
        <circle cx="168" cy="447" r="7" class="trace-dot"/>
        <circle cx="200" cy="447" r="7" class="trace-dot"/>
        <circle cx="152" cy="479" r="7" class="trace-dot"/>
        <circle cx="184" cy="479" r="7" class="trace-dot"/>
        <circle cx="216" cy="479" r="7" class="trace-dot"/>
        <circle cx="136" cy="511" r="7" class="trace-dot"/>
        <circle cx="168" cy="511" r="7" class="trace-dot"/>
        <circle cx="200" cy="511" r="7" class="trace-dot"/>
        <text x="175" y="574" class="mono center">intent → action traces</text>
      </g>

      <g>
        <text x="300" y="206" class="small">Trust orchestration</text>
        <rect x="300" y="220" width="760" height="420" rx="28" fill="rgba(10,14,20,0.86)" stroke="rgba(255,255,255,0.10)"/>

        <rect x="320" y="240" width="170" height="380" rx="20" class="node trusted"/>
        <rect x="505" y="240" width="170" height="380" rx="20" class="node trusted"/>
        <rect x="690" y="240" width="170" height="380" rx="20" class="node node-glow"/>
        <rect x="875" y="240" width="165" height="380" rx="20" class="node trusted"/>

        <text x="405" y="290" class="label center">Agent Identity</text>
        <text x="405" y="314" class="micro center">Cryptographic DID-style</text>
        <text x="405" y="333" class="micro center">signed attribution</text>
        <rect x="348" y="365" width="114" height="44" rx="22" class="pill"/>
        <text x="405" y="392" class="caption center">Signed event</text>
        <circle cx="405" cy="470" r="44" fill="none" stroke="rgba(79,209,197,0.25)" stroke-width="1.2"/>
        <circle cx="405" cy="470" r="28" fill="none" stroke="rgba(79,209,197,0.55)" stroke-width="1.6"/>
        <path d="M389 470 L401 482 L425 456" fill="none" stroke="rgba(79,209,197,0.95)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="405" y="552" class="mono center">who acted?</text>

        <text x="590" y="290" class="label center">Ephemeral Access</text>
        <text x="590" y="314" class="micro center">Task-scoped keys</text>
        <text x="590" y="333" class="micro center">short TTL</text>
        <text x="590" y="350" class="micro center">bounded permissions</text>
        <rect x="535" y="365" width="110" height="44" rx="22" class="pill"/>
        <text x="590" y="392" class="caption center">15 min TTL</text>
        <path d="M562 468 h56" stroke="rgba(216,162,75,0.7)" stroke-width="2"/>
        <path d="M574 498 h32" stroke="rgba(216,162,75,0.55)" stroke-width="2"/>
        <path d="M585 528 h12" stroke="rgba(216,162,75,0.40)" stroke-width="2"/>
        <circle cx="626" cy="468" r="6" class="amber-dot"/>
        <circle cx="610" cy="498" r="6" class="amber-dot"/>
        <circle cx="594" cy="528" r="6" class="amber-dot"/>
        <text x="590" y="552" class="mono center">blast radius reduced</text>

        <text x="775" y="290" class="label center">Intent Firewall</text>
        <text x="775" y="314" class="micro center">Intent versus action</text>
        <text x="775" y="333" class="micro center">misalignment detection</text>
        <rect x="720" y="365" width="110" height="44" rx="22" class="pill"/>
        <text x="775" y="392" class="caption center">Align score</text>
        <circle cx="775" cy="470" r="52" fill="none" stroke="rgba(79,209,197,0.28)" stroke-width="1.2"/>
        <circle cx="775" cy="470" r="34" fill="none" stroke="rgba(79,209,197,0.62)" stroke-width="2"/>
        <path d="M744 470 Q775 438 806 470 Q775 502 744 470Z" fill="none" stroke="rgba(255,255,255,0.48)" stroke-width="1.2"/>
        <circle cx="775" cy="470" r="8" fill="var(--teal)"/>
        <rect x="739" y="534" width="72" height="26" rx="13" class="blocked"/>
        <text x="775" y="552" class="caption center">Block</text>

        <text x="957.5" y="290" class="label center">Policy &amp; Audit</text>
        <text x="957.5" y="314" class="micro center">Rules, sequence checks</text>
        <text x="957.5" y="333" class="micro center">immutable trace lineage</text>
        <rect x="904" y="365" width="116" height="44" rx="22" class="pill"/>
        <text x="962" y="392" class="caption center">Audit log</text>
        <path d="M916 448 h82" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
        <path d="M916 476 h66" stroke="rgba(255,255,255,0.38)" stroke-width="2"/>
        <path d="M916 504 h90" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
        <path d="M916 532 h58" stroke="rgba(255,255,255,0.38)" stroke-width="2"/>
        <text x="957.5" y="586" class="mono center">why was it allowed?</text>
      </g>

      <g>
        <text x="1130" y="250" class="small">Protected execution</text>
        <rect x="1115" y="285" width="220" height="250" rx="18" class="terminal"/>
        <text x="1225" y="335" class="label center">Enterprise Systems</text>
        <text x="1225" y="364" class="micro center">Payments</text>
        <text x="1225" y="386" class="micro center">Patient records</text>
        <text x="1225" y="408" class="micro center">Infrastructure</text>
        <text x="1225" y="430" class="micro center">Internal APIs</text>
        <rect x="1158" y="452" width="136" height="34" rx="17" class="pill"/>
        <text x="1226" y="474" class="caption center">Approved action</text>
      </g>

      <g filter="url(#softGlow)">
        <path d="M260 352 C310 352, 336 352, 364 352 C380 352, 392 352, 405 352" class="flow" stroke="url(#tealFlow)"/>
        <path d="M405 352 C450 352, 506 352, 590 352" class="flow" stroke="url(#tealFlow)"/>
        <path d="M590 352 C636 352, 694 352, 775 352" class="flow" stroke="url(#tealFlow)"/>
        <path d="M775 352 C824 352, 888 352, 957 352" class="flow" stroke="url(#tealFlow)"/>
        <path d="M957 352 C1008 352, 1062 352, 1115 352 C1140 352, 1162 360, 1182 378" class="flow" stroke="url(#tealFlow)"/>

        <path d="M260 414 C308 414, 330 414, 358 414 C378 414, 392 414, 405 414" class="flow" stroke="url(#amberFlow)"/>
        <path d="M405 414 C450 414, 506 414, 590 414" class="flow" stroke="url(#amberFlow)"/>

        <path d="M590 414 C636 414, 694 414, 775 414" class="flow" stroke="url(#redFlow)"/>
        <path d="M775 414 C816 414, 846 414, 875 414" class="flow" stroke="url(#redFlow)"/>
        <path d="M860 414 C900 414, 930 422, 958 436 C978 446, 994 460, 1010 484" class="flow" stroke="url(#redFlow)"/>
      </g>

      <g>
        <circle cx="826" cy="486" r="16" class="blocked"/>
        <path d="M819 479 L833 493 M833 479 L819 493" stroke="rgba(227,107,107,0.95)" stroke-width="2.6" stroke-linecap="round"/>
        <text x="846" y="482" class="caption">Misaligned action</text>
        <text x="846" y="500" class="caption">quarantined</text>

        <circle cx="1010" cy="484" r="16" class="blocked"/>
        <path d="M1003 477 L1017 491 M1017 477 L1003 491" stroke="rgba(227,107,107,0.95)" stroke-width="2.6" stroke-linecap="round"/>
        <text x="1030" y="480" class="caption">Policy violation</text>
        <text x="1030" y="498" class="caption">blocked</text>
      </g>

      <g>
        <path d="M260 604 C420 646, 728 646, 1115 604" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.4" stroke-dasharray="4 10"/>
        <circle cx="430" cy="637" r="4" fill="var(--teal)"/>
        <circle cx="617" cy="648" r="4" fill="var(--amber)"/>
        <circle cx="822" cy="640" r="4" fill="var(--teal)"/>
        <circle cx="1018" cy="620" r="4" fill="var(--teal)"/>
        <text x="300" y="688" class="small">Lineage</text>
        <text x="300" y="716" class="micro">The dotted trace is the audit lineage, showing every decision recorded across the trust chain.</text>
      </g>

      <g>
        <line x1="90" y1="780" x2="1350" y2="780" class="divider"/>
        <line x1="92" y1="818" x2="136" y2="818" stroke="rgba(79,209,197,0.8)" stroke-width="2" stroke-linecap="round"/>
        <text x="148" y="822" class="footer-copy">Approved execution path</text>
        <line x1="400" y1="818" x2="444" y2="818" stroke="rgba(216,162,75,0.8)" stroke-width="2" stroke-linecap="round"/>
        <text x="456" y="822" class="footer-copy">Scoped, time-bound credential flow</text>
        <line x1="840" y1="818" x2="884" y2="818" stroke="rgba(227,107,107,0.82)" stroke-width="2" stroke-linecap="round"/>
        <text x="896" y="822" class="footer-copy">Blocked or misaligned action</text>
      </g>
    </svg>
  </div>
</body>
</html>
